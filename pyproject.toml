[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemill"
version = "0.1.0"
description = "Verification-first coding harness for small language models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["codemill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
