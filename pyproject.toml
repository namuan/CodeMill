[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemill"
version = "0.1.0"
description = "Verification-first coding harness for small language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
codemill = "codemill.cli:main"
codemill-benchmark = "codemill.benchmark_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["codemill"]
